name: Garder l'app éveillée

on:
  schedule:
    # Toutes les 6 heures — marge confortable sous le seuil de 12h de
    # Streamlit Community Cloud. Séparé du pipeline de données (qui ne
    # tourne que vendredi/lundi/mardi, bien trop espacé pour ça).
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visiter l'app
        run: python scripts/keep_awake.py
        env:
          # À corriger si l'URL finale de l'app diffère.
          APP_URL: https://nfl-analytics-fr.streamlit.app
