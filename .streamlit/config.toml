[theme]
# Thème clair par défaut (peut être basculé en sombre via un toggle dans l'app)
base = "light"
primaryColor = "#EA580C"  # Orange (couleur principale)
backgroundColor = "#F8FAFC"  # Blanc cassé
secondaryBackgroundColor = "#EFF2F6"  # Gris très clair
textColor = "#1E293B"  # Gris foncé
font = "sans serif"

[server]
# Configuration du serveur Streamlit
headless = true
port = 8501

[client]
# Caching activé pour de meilleures performances
caching = true
# "viewer" cache les options développeur (Deploy, clear cache...) tout en
# gardant Settings accessible aux visiteurs — c'est via Settings que vit le
# sélecteur de thème clair/sombre natif de Streamlit. "minimal" le cachait
# aussi, ce qui n'était pas voulu.
toolbarMode = "viewer"

[logger]
# Niveau de log
level = "info"
