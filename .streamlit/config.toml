[theme]
# Thème clair par défaut (peut être basculé en sombre via un toggle dans l'app)
base = "light"
primaryColor = "#EA580C"  # Orange (couleur principale)
backgroundColor = "#F8FAFC"  # Blanc cassé
secondaryBackgroundColor = "#EFF2F6"  # Gris très clair
textColor = "#1E293B"  # Gris foncé
font = "sans serif"

[server]
# Configuration du serveur Streamlit
headless = true
port = 8501

[client]
# Caching activé pour de meilleures performances
caching = true
# "minimal" masque le menu Streamlit natif (Rerun, Settings, Print, Report
# a bug...) pour les visiteurs. N'affecte PAS la barre Share/étoile/GitHub
# de Streamlit Community Cloud tout en haut — celle-ci fait partie du
# produit d'hébergement lui-même, aucun réglage app-side ne la retire.
toolbarMode = "minimal"

[logger]
# Niveau de log
level = "info"
